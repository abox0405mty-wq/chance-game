<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>パワーリフティング チャンスゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>パワーリフティング チャンス！</h1>
      <p class="subtitle">美女たちの応援でスクワットを成功させよう。制限時間: <span id="timer">60</span> 秒</p>
    </header>

    <main>
      <section class="status" aria-live="polite">
        <div>現在の重量: <span id="weight">100</span> kg</div>
        <div>クリア数: <span id="cleared">0</span></div>
        <div>現在の応援: <span id="cheers">0</span></div>
      </section>

      <section class="stage">
        <div class="cheerleaders" id="cheerleaders" aria-label="応援団">
          <div class="cheer" data-index="0"></div>
          <div class="cheer" data-index="1"></div>
          <div class="cheer" data-index="2"></div>
          <div class="cheer" data-index="3"></div>
          <div class="cheer" data-index="4"></div>
        </div>

        <div class="platform">
          <div class="lifter" id="lifter">
            <div class="head"></div>
            <div class="body"></div>
          </div>
          <div class="squat-progress" aria-label="スクワット進行度">
            <div class="progress-bar" id="progress"></div>
          </div>
          <p id="message" class="message" aria-live="assertive"></p>
        </div>
      </section>

      <section class="controls">
        <button id="cheerBtn" class="button" type="button">チャンス！</button>
        <button id="startBtn" class="button secondary" type="button">スタート</button>
        <button id="resetBtn" class="button secondary" type="button">リセット</button>
      </section>

      <section class="notes">
        <p>説明: スタートで60秒のチャレンジが始まります。下の「チャンス！」ボタンを押すごとに美女たちが応援し、スクワットの進みが速くなります。重量を挙げきると次の重量に挑戦！ 何回クリアできるか挑戦してみましょう。</p>
      </section>
    </main>

    <footer>
      <small>Made with ❤️ — チャンス！</small>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
